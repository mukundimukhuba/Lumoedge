  <body>
    <!-- Outside #root so Safari tab discard / React wipe never leaves a pure black screen -->
    <div id="boot-shell" class="boot-shell" aria-busy="true">
      <img src="/lumo-logo.png" alt="" width="88" height="88" />
      <strong>Lumo Edge</strong>
      <span id="boot-status">Loading…</span>
      <button type="button" id="boot-reload">Reload</button>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var shell = document.getElementById('boot-shell');
        var status = document.getElementById('boot-status');
        var reloadBtn = document.getElementById('boot-reload');
        var ready = false;
        var recovering = false;
        var capped = false;
        var RELOAD_KEY = 'lumo-blank-recover';
        var WARM_KEY = 'lumo-was-ready';

        function hideShell() {
          ready = true;
          if (!shell) return;
          shell.classList.add('is-hidden');
          shell.classList.remove('is-chip', 'needs-reload');
          shell.setAttribute('aria-busy', 'false');
        }

        /** Non-blocking chip — NEVER full-screen trap after first paint window */
        function showReloadChip(msg) {
          if (!shell || ready) return;
          if (status && msg) status.textContent = msg;
          shell.classList.remove('is-hidden');
          shell.classList.add('is-chip', 'needs-reload');
          shell.setAttribute('aria-busy', 'false');
        }

        function appAlive() {
          var root = document.getElementById('root');
          if (!root) return false;
          if (root.childElementCount > 0) return true;
          return Boolean(
            root.querySelector(
              '.app-shell, .lumo-app, .welcome-splash, .admin-shell-dark, .os-home-shell',
            ),
          );
        }

        function hadWarmSession() {
          try {
            return sessionStorage.getItem(WARM_KEY) === '1';
          } catch (e) {
            return false;
          }
        }

        function softReload() {
          if (recovering || !capped) return;
          recovering = true;
          try {
            var n = Number(sessionStorage.getItem(RELOAD_KEY) || '0');
            if (n >= 2) {
              showReloadChip('Tap Reload');
              recovering = false;
              return;
            }
            sessionStorage.setItem(RELOAD_KEY, String(n + 1));
          } catch (e) {}
          location.reload();
        }

        window.__lumoMarkReady = function () {
          try {
            sessionStorage.removeItem(RELOAD_KEY);
            sessionStorage.setItem(WARM_KEY, '1');
          } catch (e) {}
          hideShell();
        };

        if (reloadBtn) {
          reloadBtn.addEventListener('click', function () {
            try {
              sessionStorage.removeItem(RELOAD_KEY);
            } catch (e) {}
            location.reload();
          });
        }

        // Hard cap — hide full-screen splash; never show "Taking longer…" full screen again
        window.setTimeout(function () {
          capped = true;
          if (ready || appAlive()) {
            hideShell();
            return;
          }
          hideShell();
          // Only a tiny chip if React still has not painted — app stays usable underneath
          window.setTimeout(function () {
            if (!appAlive()) showReloadChip('Slow load — Reload');
            else hideShell();
          }, 1200);
        }, 2000);

        function checkResume(force) {
          if (document.visibilityState && document.visibilityState !== 'visible') return;
          if (!force && !ready && !hadWarmSession()) return;
          window.setTimeout(function () {
            if (appAlive()) {
              hideShell();
              return;
            }
            // Blank after tab discard — one soft reload, never a blocking splash loop
            softReload();
          }, 400);
        }

        window.addEventListener('pageshow', function (ev) {
          if (ev.persisted) {
            checkResume(true);
            return;
          }
          if (ready || appAlive()) hideShell();
        });

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkResume(false);
        });

        window.addEventListener('lumo-ready', function () {
          try {
            sessionStorage.setItem(WARM_KEY, '1');
          } catch (e) {}
          hideShell();
        });
      })();
    </script>
